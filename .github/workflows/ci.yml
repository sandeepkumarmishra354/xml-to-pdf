name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Format & vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: Build the WebAssembly playground
        run: |
          GOOS=js GOARCH=wasm go vet ./cmd/xml2pdf-wasm
          make playground
      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install pdftotext (enables PDF text checks in tests)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: go test (with race detector)
        if: runner.os != 'Windows'
        run: go test -race ./...
      - name: go test
        # The race detector needs cgo and a C toolchain; keep Windows simple.
        if: runner.os == 'Windows'
        run: go test ./...
      - name: Build and render examples
        shell: bash
        run: |
          CGO_ENABLED=0 go build -o bin/xml2pdf ./cmd/xml2pdf
          bin/xml2pdf examples/hello.xml -o bin/hello.pdf
          bin/xml2pdf examples/invoice.xml --data examples/invoice.json -o bin/invoice.pdf
          bin/xml2pdf examples/report.xml -o bin/report.pdf
          ls -l bin/*.pdf

  goreleaser-check:
    name: Release config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check

  install-script:
    name: Install script (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck install.sh
      - name: Install the latest release with install.sh
        env:
          XML2PDF_INSTALL_DIR: ${{ runner.temp }}/bin
        run: sh install.sh
      - name: Run the installed binary
        run: |
          "$RUNNER_TEMP/bin/xml2pdf" --version | grep -E '^xml2pdf [0-9]+\.[0-9]+\.[0-9]+'
          "$RUNNER_TEMP/bin/xml2pdf" examples/hello.xml -o "$RUNNER_TEMP/hello.pdf"
          test -s "$RUNNER_TEMP/hello.pdf"
